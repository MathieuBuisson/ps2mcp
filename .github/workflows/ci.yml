name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Configure Git line endings
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf

      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore .\ps2mcp.slnx

      - name: Verify formatting
        run: dotnet format --verify-no-changes .\ps2mcp.slnx --no-restore

      - name: Smoke test
        run: dotnet test .\ps2mcp.slnx --no-restore
